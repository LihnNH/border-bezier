name: Publish to GitHub Packages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@lihnnh"

      - name: Install dependencies
        run: npm ci

      - name: Use scoped GitHub Packages name
        run: npm pkg set name="@lihnnh/border-bezier"

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}